- name: Home Lab
  descr: "I built and maintained a hybrid homelab using physical hardware, Xen virtual machines, and AWS to gain hands-on experience in system administration, network configuration, and cybersecurity practices.<br><br>
    Key projects and skills practiced include:
      <ul>
        <li>Configured firewalls and routing to secure networks</li>
        <li>Applied port forwarding and tunneling for pivoting</li>
        <li>Tested persistence mechanisms and C2 frameworks</li>
        <li>Analyzed PCAPs with Wireshark to detect anomalous traffic</li>
        <li>Simulated rogue AP for MitM and captive portal tests</li>
        <li>Captured WPA handshakes and tested offline cracking techniques</li>
        <li>Studied antivirus evasion in isolated environments</li>
        <li>Deployed web servers to learn about secure configurations</li>
      </ul>"
